name: Run Tests

on:
  push:
    branches: [ mateo-ortiz-lopez, main ]
  pull_request:
    branches: [ mateo-ortiz-lopez, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # o el que estés usando

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
